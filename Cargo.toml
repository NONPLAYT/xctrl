[package]
name = "xctrl"
version = "0.1.0"
edition = "2024"
description = "Xray control plane for NixOS systems"
license = "MIT"
repository = "https://github.com/NONPLAYT/xctrl"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive", "env"] }
fast_qr = { version = "0.13", features = ["svg"] }
minijinja = "2"
prost = "0.14"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tonic = "0.14"
tonic-prost = "0.14"
urlencoding = "2"

[build-dependencies]
tonic-prost-build = "0.14"
